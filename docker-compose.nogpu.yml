# GPU'suz yedek (yazılım render, yavaş). Kullanım:
#   docker compose -f docker-compose.nogpu.yml up -d
services:
  rover_sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: rover_sim:latest
    container_name: rover_sim
    command: sleep infinity
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./rover_sim:/home/ros/rover_sim
      - ./test:/home/ros/test
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
