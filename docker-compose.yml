# GPU'lu (NVIDIA) çalışma. GPU'suz yedek için: docker-compose.nogpu.yml (README'ye bak).
services:
  rover_sim:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - USERNAME=ros
        - USER_UID=1000
        - USER_GID=1000
    image: rover_sim:latest
    container_name: rover_sim
    command: sleep infinity
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./rover_sim:/home/ros/rover_sim
      - ./test:/home/ros/test
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    group_add:
      - video
